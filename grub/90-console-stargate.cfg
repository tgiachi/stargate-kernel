# Console di boot in stile Gentoo: palette VT ispirata ai colori Gentoo e un
# solo logo fbcon (il kernel "stargate" ne disegna uno per CPU online, 24 su
# questo HX 370, e non e' quello che si vuole vedere).
#
# vt.default_{red,grn,blu}: i 16 colori della console VT nell'ordine standard
#   0 nero, 1 rosso, 2 verde, 3 giallo, 4 blu, 5 magenta, 6 ciano, 7 grigio,
#   8-15 le versioni brillanti. systemd usa verde per "[  OK  ]" e rosso per
#   "[FAILED]", quindi sono i due che contano davvero; 4/5/12/13 sono i viola
#   Gentoo (#54487A, #61538D e le varianti chiare).
#
# fbcon=logo-count:1: un solo logo in alto a sinistra invece di uno per CPU.
#   Ha effetto solo con CONFIG_LOGO=y (kernel stargate); il kernel Debian lo
#   ignora perche' non ha il logo affatto.
#
# Per tornare indietro: rimuovere il link con
#   sudo stow --dir=/usr/local/stow --target=/ --delete grub-cmdline
# e rieseguire update-grub, oppure premere `e` nel menu GRUB e cancellare i
# parametri dalla riga linux per un singolo avvio.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} vt.default_red=0,204,0,196,84,97,6,211,85,239,138,252,110,187,52,238 vt.default_grn=0,0,170,160,72,83,152,215,87,41,226,233,86,170,226,238 vt.default_blu=0,0,0,0,122,141,154,207,83,41,52,79,175,230,226,236 fbcon=logo-count:1"
